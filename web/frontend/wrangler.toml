# Cloudflare Workers'ga deploy: statik frontend (dist/) + /api va /ws uchun
# proksi-skript (worker.js), shu bilan sayt bitta domenda ishlaydi
# (yonaltiruvchi.uz) — cookie'lar va nisbiy /api so'rovlari o'zgarishsiz
# ishlayveradi.

name = "compass-web"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws/*"]

[vars]
# Backend server manzili — serverdagi nginx shu hostga origin.yonaltiruvchi.uz
# sifatida sertifikat olib xizmat qiladi, /app/web konteyneriga proksilaydi
# (127.0.0.1:8000).
BACKEND_ORIGIN = "https://origin.yonaltiruvchi.uz"

[[routes]]
pattern = "yonaltiruvchi.uz"
custom_domain = true
