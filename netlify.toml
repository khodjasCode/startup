# Netlify — faqat frontend (React SPA) uchun.
#
# ⚠️ Netlify Python funksiyalarini qo'llab-quvvatlamaydi, shuning uchun FastAPI
# backend bu yerda ishlamaydi — u alohida xostda turadi (Render/Railway/Fly).
#
# Sayt: https://compass-uzb.netlify.app  (project id a0da2899-05b2-451c-a094-a1a735187634)
# "compass" nomi Netlify'da band edi, shuning uchun "compass-uzb".
#
# Sayt **mahalliy yig'ilgan** `web/frontend/dist` papkasidan yuklanadi:
#
#     python3 -m baza.kochirish          # baza yangi bo'lsa
#     cd web/frontend && npm run build   # dist + public/data/katalog.json
#     npx netlify deploy --prod --dir=web/frontend/dist --site=compass-uzb
#
# Nega Netlify'ning o'zida yig'ilmaydi: `npm run build` oldidan
# `python -m web.eksport_katalog` ishlaydi va u Postgres'ga ulanadi
# (Netlify build muhitida psycopg2 ham, DATABASE_URL ham yo'q).

[build]
  publish = "web/frontend/dist"

# /api va /ws Render'dagi backendga proksilanadi. Shu tufayli brauzer uchun
# hammasi bitta domen (compass-uzb.netlify.app) — CORS ham, `SameSite=None`
# cookie ham kerak emas, sessiya odatdagidek ishlaydi.
#
# ⚠️ Backend bepul tarifda: 15 daqiqa murojaat bo'lmasa uxlaydi va birinchi
# so'rov ~50 soniya kutadi. Katalog bu vaqtda ham ko'rinadi — frontend
# javobni kutmay /data/katalog.json zaxirasiga o'tadi; chat va kirish esa
# backend uyg'onishini kutadi.
[[redirects]]
  from = "/api/*"
  to = "https://compass-api-x8uy.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ws/*"
  to = "wss://compass-api-x8uy.onrender.com/ws/:splat"
  status = 200
  force = true

# SPA: barcha noma'lum yo'llar index.html ga (client-side routing).
# Bu qoida oxirida turishi kerak — undan yuqoridagilar ustun bo'ladi.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
